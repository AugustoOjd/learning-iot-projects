[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Código compartido entre proyectos
lib_extra_dirs = ../../../shared

build_flags =
    -I../../../shared
    -DCORE_DEBUG_LEVEL=3

lib_deps =

; Verificación de toolchain: no necesita ningún cable conectado.
;   pio run -e blink-test -t upload
[env:blink-test]
build_src_filter = +<blink_test.cpp>

; Diagnóstico: separa el LED del botón para aislar cuál mitad falla.
;   pio run -e diagnostico -t upload
[env:diagnostico]
build_src_filter = +<diagnostico.cpp>

; El proyecto de la semana.
;   pio run -e s01-panel-alarma -t upload
[env:s01-panel-alarma]
build_src_filter = +<main.cpp>
